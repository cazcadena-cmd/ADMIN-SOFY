<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Tienda</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase Client JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- Encabezado -->
    <header class="border-b border-slate-700 pb-4 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold text-sky-400">Panel de Control de Tienda</h1>
        <p class="text-slate-400 text-sm">Gestión de datos, productos y multimedia con Supabase</p>
      </div>
      <div id="status-badge" class="px-3 py-1 text-xs rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
        Configura tus credenciales
      </div>
    </header>

    <!-- Configuración de credenciales -->
    <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
      <h2 class="text-xl font-semibold mb-4 text-slate-200">1. Credenciales de Supabase</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1">SUPABASE_URL</label>
          <input type="text" id="cfg_url" placeholder="https://tu-proyecto.supabase.co" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1">SUPABASE_ANON_KEY</label>
          <input type="password" id="cfg_key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..." class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm focus:outline-none focus:border-sky-500">
        </div>
      </div>
      <button onclick="inicializarSupabase()" class="mt-4 px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-medium rounded-lg text-sm transition">
        Conectar Cliente
      </button>
    </section>

    <!-- Gestión de Tienda -->
    <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
      <h2 class="text-xl font-semibold mb-4 text-slate-200">2. Información de la Tienda</h2>
      <form id="formTienda" onsubmit="guardarTienda(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">ID del Negocio (business_id) *</label>
          <input type="text" id="shop_business_id" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Nombre Comercial *</label>
          <input type="text" id="shop_name" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Categoría</label>
          <input type="text" id="shop_category" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">WhatsApp de contacto</label>
          <input type="text" id="shop_whatsapp" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Logo (Bucket: logos)</label>
          <input type="file" id="shop_logo_file" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-400">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Video promocional (Bucket: videos)</label>
          <input type="file" id="shop_video_file" accept="video/*" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-400">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm text-slate-400 mb-1">Descripción</label>
          <textarea id="shop_description" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm"></textarea>
        </div>
        <div class="md:col-span-2">
          <button type="submit" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg text-sm transition">
            Guardar / Actualizar Tienda
          </button>
        </div>
      </form>
    </section>

    <!-- Gestión de Productos -->
    <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
      <h2 class="text-xl font-semibold mb-4 text-slate-200">3. Registro de Productos</h2>
      <form id="formProducto" onsubmit="guardarProducto(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div>
          <label class="block text-sm text-slate-400 mb-1">ID Negocio Asociado</label>
          <input type="text" id="prod_business_id" placeholder="Opcional" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Nombre del Producto *</label>
          <input type="text" id="prod_name" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Precio</label>
          <input type="number" step="0.01" id="prod_price" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Categoría del Producto</label>
          <input type="text" id="prod_category" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Imagen del Producto (Bucket: logos)</label>
          <input type="file" id="prod_image_file" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-400">
        </div>
        <div class="md:col-span-3">
          <label class="block text-sm text-slate-400 mb-1">Descripción corta</label>
          <input type="text" id="prod_description" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm">
        </div>
        <div class="md:col-span-3">
          <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg text-sm transition">
            Guardar Producto
          </button>
        </div>
      </form>

      <!-- Tabla de productos cargados -->
      <div class="overflow-x-auto border border-slate-700 rounded-lg">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900 text-slate-400 uppercase text-xs">
            <tr>
              <th class="p-3">Imagen</th>
              <th class="p-3">Nombre</th>
              <th class="p-3">Categoría</th>
              <th class="p-3">Precio</th>
              <th class="p-3">Business ID</th>
              <th class="p-3">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla_productos" class="divide-y divide-slate-700">
            <tr>
              <td colspan="6" class="p-4 text-center text-slate-500">Conecta Supabase para cargar productos.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- JavaScript Lógico Completo con Parches Aplicados -->
  <script>
    let supabaseClient = null;

    // 1. Inicializar cliente Supabase
    function inicializarSupabase() {
      const url = document.getElementById('cfg_url').value.trim();
      const key = document.getElementById('cfg_key').value.trim();

      if (!url || !key) {
        alert('Por favor ingresa URL y Key de Supabase');
        return;
      }

      try {
        supabaseClient = supabase.createClient(url, key);
        const badge = document.getElementById('status-badge');
        badge.textContent = 'Conectado a Supabase';
        badge.className = 'px-3 py-1 text-xs rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
        
        cargarProductos();
      } catch (err) {
        console.error('Error al inicializar Supabase:', err);
        alert('Error al conectar cliente Supabase: ' + err.message);
      }
    }

    // 2. Función auxiliar segura para subida de archivos
    async function subirArchivo(fileInputId, bucketName) {
      const fileInput = document.getElementById(fileInputId);
      if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        return null; // Ningún archivo seleccionado
      }

      const file = fileInput.files[0];
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
      const filePath = `${fileName}`;

      const { data, error } = await supabaseClient.storage
        .from(bucketName)
        .upload(filePath, file, { cacheControl: '3600', upsert: true });

      if (error) {
        console.error(`Error subiendo archivo al bucket ${bucketName}:`, error);
        throw new Error(`Fallo en almacenamiento (${bucketName}): ${error.message}`);
      }

      const { data: publicUrlData } = supabaseClient.storage
        .from(bucketName)
        .getPublicUrl(filePath);

      return publicUrlData.publicUrl;
    }

    // 3. Guardar o actualizar datos de la tienda
    async function guardarTienda(event) {
      event.preventDefault();
      if (!supabaseClient) return alert('Primero inicializa las credenciales.');

      try {
        let logoUrl = await subirArchivo('shop_logo_file', 'logos');
        let videoUrl = await subirArchivo('shop_video_file', 'videos');

        const businessId = document.getElementById('shop_business_id').value.trim();

        const payload = {
          business_id: businessId,
          name: document.getElementById('shop_name').value.trim(),
          category: document.getElementById('shop_category').value.trim() || null,
          whatsapp: document.getElementById('shop_whatsapp').value.trim() || null,
          description: document.getElementById('shop_description').value.trim() || null
        };

        if (logoUrl) payload.logo = logoUrl;
        if (videoUrl) payload.video = videoUrl;

        const { data, error } = await supabaseClient
          .from('shops')
          .upsert(payload, { onConflict: 'business_id' });

        if (error) throw error;

        alert('¡Información de la tienda guardada con éxito!');
      } catch (err) {
        console.error('Error en guardarTienda:', err);
        alert('Error al guardar tienda: ' + err.message);
      }
    }

    // 4. Guardar producto con parches de tipos nulos y conversión numérica
    async function guardarProducto(event) {
      event.preventDefault();
      if (!supabaseClient) return alert('Primero inicializa las credenciales.');

      try {
        let imageUrl = await subirArchivo('prod_image_file', 'logos');

        const rawBusinessId = document.getElementById('prod_business_id').value.trim();
        const rawPrice = document.getElementById('prod_price').value.trim();

        // Parches de conversión para evitar errores 400 Bad Request
        const payload = {
          business_id: rawBusinessId !== '' ? rawBusinessId : null,
          name: document.getElementById('prod_name').value.trim(),
          price: rawPrice !== '' ? parseFloat(rawPrice) : null,
          category: document.getElementById('prod_category').value.trim() || null,
          description: document.getElementById('prod_description').value.trim() || null
        };

        if (imageUrl) payload.image_url = imageUrl;

        const { error } = await supabaseClient
          .from('shop_products')
          .insert([payload]);

        if (error) throw error;

        alert('¡Producto guardado exitosamente!');
        document.getElementById('formProducto').reset();
        cargarProductos();
      } catch (err) {
        console.error('Error en guardarProducto:', err);
        alert('Error al guardar producto: ' + err.message);
      }
    }

    // 5. Cargar y listar productos en la tabla
    async function cargarProductos() {
      if (!supabaseClient) return;

      const tbody = document.getElementById('tabla_productos');
      tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">Cargando productos...</td></tr>';

      try {
        const { data, error } = await supabaseClient
          .from('shop_products')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-500">No hay productos registrados.</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(p => `
          <tr class="hover:bg-slate-800/50 transition">
            <td class="p-3">
              ${p.image_url ? `<img src="${p.image_url}" class="w-10 h-10 object-cover rounded border border-slate-700">` : '<span class="text-xs text-slate-500">Sin foto</span>'}
            </td>
            <td class="p-3 font-medium text-slate-200">${p.name || '-'}</td>
            <td class="p-3 text-slate-400">${p.category || '-'}</td>
            <td class="p-3 text-emerald-400 font-medium">${p.price !== null ? '$' + p.price : '-'}</td>
            <td class="p-3 text-slate-400">${p.business_id || '<span class="text-slate-600">N/A</span>'}</td>
            <td class="p-3">
              <button onclick="eliminarProducto('${p.id}')" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1 rounded border border-rose-500/30 hover:bg-rose-500/10">
                Eliminar
              </button>
            </td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('Error en cargarProductos:', err);
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-rose-400">Error: ${err.message}</td></tr>`;
      }
    }

    // 6. Eliminar producto
    async function eliminarProducto(id) {
      if (!confirm('¿Estás seguro de eliminar este producto?')) return;

      try {
        const { error } = await supabaseClient
          .from('shop_products')
          .delete()
          .eq('id', id);

        if (error) throw error;

        cargarProductos();
      } catch (err) {
        alert('Error al eliminar producto: ' + err.message);
      }
    }
  </script>
</body>
</html>
