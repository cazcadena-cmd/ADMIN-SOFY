<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador General - Supabase</title>
  
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f6f8; color: #333; }
    h1 { color: #134989; margin-bottom: 20px; }
    
    /* Pestañas */
    .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #275C98; }
    .tab-btn { padding: 10px 20px; background: #e0e0e0; border: none; border-radius: 6px 6px 0 0; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #275C98; color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .toolbar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-primary { background-color: #134989; color: white; }
    .btn-danger { background-color: #d9534f; color: white; }
    .btn-secondary { background-color: #6c757d; color: white; }

    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 13px; }
    th { background-color: #275C98; color: white; text-transform: uppercase; font-size: 11px; }
    tr:hover { background-color: #f9fbfd; }

    img.thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid #ccc; }
    a.media-link { font-size: 11px; color: #134989; font-weight: bold; text-decoration: none; word-break: break-all; }

    /* Modal / Formulario */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: white; padding: 25px; border-radius: 10px; width: 95%; max-width: 700px; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 12px; color: #555; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h1>Administrador de Comercios, Banners y Productos</h1>

  <!-- Pestañas -->
  <div class="tabs">
    <button class="tab-btn active" onclick="cambiarTab('comercios')">🏪 Comercios</button>
    <button class="tab-btn" onclick="cambiarTab('productos')">📦 Productos</button>
    <button class="tab-btn" onclick="cambiarTab('banners')">🖼️ Banners</button>
  </div>

  <!-- TAB COMERCIOS -->
  <div id="tab-comercios" class="tab-content active">
    <div class="toolbar">
      <button class="btn-primary" onclick="abrirModalComercio()">➕ Nuevo Comercio</button>
    </div>
    <div id="tabla-comercios">Cargando comercios...</div>
  </div>

  <!-- TAB PRODUCTOS -->
  <div id="tab-productos" class="tab-content">
    <div class="toolbar">
      <button class="btn-primary" onclick="abrirModalProducto()">➕ Nuevo Producto</button>
    </div>
    <div id="tabla-productos">Cargando productos...</div>
  </div>

  <!-- TAB BANNERS -->
  <div id="tab-banners" class="tab-content">
    <div class="toolbar">
      <button class="btn-primary" onclick="abrirModalBanner()">➕ Nuevo Banner</button>
    </div>
    <div id="tabla-banners">Cargando banners...</div>
  </div>

  <!-- MODAL COMERCIO -->
  <div class="modal-overlay" id="modalComercio">
    <div class="modal">
      <h2 id="modalComercioTitle">Comercio</h2>
      <form id="formComercio" onsubmit="guardarComercio(event)">
        <input type="hidden" id="shop_id">
        <div class="form-row">
          <div class="form-group"><label>ID del Negocio (business_id) *</label><input type="text" id="shop_business_id" required></div>
          <div class="form-group"><label>Nombre del Comercio *</label><input type="text" id="shop_name" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Categoría</label><input type="text" id="shop_category"></div>
          <div class="form-group"><label>WhatsApp</label><input type="text" id="shop_whatsapp"></div>
        </div>
        <div class="form-group"><label>Descripción</label><textarea id="shop_description" rows="2"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label>Dirección</label><input type="text" id="shop_address"></div>
          <div class="form-group"><label>Horario</label><input type="text" id="shop_schedule"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Subir Logo (Bucket: logos)</label><input type="file" id="file_logo" accept="image/*"></div>
          <div class="form-group"><label>Subir Portada Imagen (Bucket: logos)</label><input type="file" id="file_cover_image" accept="image/*"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Subir Video (Bucket: videos)</label><input type="file" id="file_video" accept="video/*"></div>
          <div class="form-group"><label>URL de Video Externo / YouTube</label><input type="text" id="shop_video_url"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="cerrarModales()">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar Comercio</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL PRODUCTO -->
  <div class="modal-overlay" id="modalProducto">
    <div class="modal">
      <h2 id="modalProductoTitle">Producto</h2>
      <form id="formProducto" onsubmit="guardarProducto(event)">
        <input type="hidden" id="product_id">
        <div class="form-row">
          <div class="form-group">
            <label>Comercio Asociado (business_id) *</label>
            <select id="prod_business_id" required></select>
          </div>
          <div class="form-group"><label>Nombre del Producto *</label><input type="text" id="prod_name" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Precio</label><input type="number" step="0.01" id="prod_price"></div>
          <div class="form-group"><label>Categoría</label><input type="text" id="prod_category"></div>
        </div>
        <div class="form-group"><label>Descripción</label><textarea id="prod_description" rows="2"></textarea></div>
        <div class="form-group"><label>Subir Imagen del Producto (Bucket: logos)</label><input type="file" id="prod_file" accept="image/*"></div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="cerrarModales()">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar Producto</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL BANNER -->
  <div class="modal-overlay" id="modalBanner">
    <div class="modal">
      <h2 id="modalBannerTitle">Banner</h2>
      <form id="formBanner" onsubmit="guardarBanner(event)">
        <input type="hidden" id="banner_id">
        <div class="form-row">
          <div class="form-group">
            <label>Comercio Asociado (business_id) *</label>
            <select id="banner_business_id" required></select>
          </div>
          <div class="form-group"><label>Título del Banner</label><input type="text" id="banner_title"></div>
        </div>
        <div class="form-group"><label>Subir Imagen del Banner (Bucket: logos)</label><input type="file" id="banner_file" accept="image/*"></div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="cerrarModales()">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar Banner</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jpukgeomsmwyxtqnpcsd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwdWtnZW9tc213eXh0cW5wY3NkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMDA3MzQsImV4cCI6MjEwNDU3NjczNH0.aALmQGfEkU4YCJM_9yUGJoUYfFVSLaZe0tnOlznKm54';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let listShops = [], listProducts = [], listBanners = [];

    document.addEventListener('DOMContentLoaded', () => {
      cargarTodo();
    });

    async function cargarTodo() {
      await Promise.all([cargarComercios(), cargarProductos(), cargarBanners()]);
      actualizarSelectsNegocios();
    }

    function cambiarTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    // --- COMERCIOS ---
    async function cargarComercios() {
      const { data, error } = await supabaseClient.from('shops').select('*').order('id', { ascending: false });
      if (error) return console.error(error);
      listShops = data || [];
      
      let html = `<table><thead><tr><th>ID / BusinessID</th><th>Logo</th><th>Nombre</th><th>Categoría</th><th>Portada</th><th>Video</th><th>Acciones</th></tr></thead><tbody>`;
      listShops.forEach(c => {
        const logo = c.logo ? `<img src="${c.logo}" class="thumb">` : '—';
        const cover = c.cover_image ? `<img src="${c.cover_image}" class="thumb">` : '—';
        const video = c.video || c.video_url || c.cover_video ? `<a href="${c.video || c.video_url || c.cover_video}" target="_blank" class="media-link">▶ Ver Video</a>` : '—';
        
        html += `<tr>
          <td>#${c.id} <br><small style="color:#666;">${c.business_id || 'Sin ID'}</small></td>
          <td>${logo}</td>
          <td><strong>${c.name || ''}</strong></td>
          <td>${c.category || ''}</td>
          <td>${cover}</td>
          <td>${video}</td>
          <td>
            <button class="btn-primary" onclick="abrirModalComercio(${c.id})">✏️</button>
            <button class="btn-danger" onclick="eliminarRegistro('shops', ${c.id}, cargarComercios)">🗑️</button>
          </td>
        </tr>`;
      });
      html += `</tbody></table>`;
      document.getElementById('tabla-comercios').innerHTML = html;
    }

    // --- PRODUCTOS ---
    async function cargarProductos() {
      const { data, error } = await supabaseClient.from('shop_products').select('*').order('created_at', { ascending: false });
      if (error) return console.error(error);
      listProducts = data || [];

      let html = `<table><thead><tr><th>Imagen</th><th>Producto</th><th>Business ID</th><th>Precio</th><th>Categoría</th><th>Acciones</th></tr></thead><tbody>`;
      listProducts.forEach(p => {
        const img = p.image_url ? `<img src="${p.image_url}" class="thumb">` : '—';
        html += `<tr>
          <td>${img}</td>
          <td><strong>${p.name || ''}</strong></td>
          <td>${p.business_id || ''}</td>
          <td>$${p.price || 0}</td>
          <td>${p.category || ''}</td>
          <td>
            <button class="btn-danger" onclick="eliminarRegistro('shop_products', '${p.id}', cargarProductos)">🗑️</button>
          </td>
        </tr>`;
      });
      html += `</tbody></table>`;
      document.getElementById('tabla-productos').innerHTML = html;
    }

    // --- BANNERS ---
    async function cargarBanners() {
      const { data, error } = await supabaseClient.from('shop_banners').select('*').order('created_at', { ascending: false });
      if (error) return console.error(error);
      listBanners = data || [];

      let html = `<table><thead><tr><th>Imagen</th><th>Título</th><th>Business ID</th><th>Acciones</th></tr></thead><tbody>`;
      listBanners.forEach(b => {
        const img = b.image_url ? `<img src="${b.image_url}" class="thumb">` : '—';
        html += `<tr>
          <td>${img}</td>
          <td><strong>${b.title || 'Sin Título'}</strong></td>
          <td>${b.business_id || ''}</td>
          <td>
            <button class="btn-danger" onclick="eliminarRegistro('shop_banners', '${b.id}', cargarBanners)">🗑️</button>
          </td>
        </tr>`;
      });
      html += `</tbody></table>`;
      document.getElementById('tabla-banners').innerHTML = html;
    }

    // --- SUBIR ARCHIVOS ---
    async function subirArchivo(bucket, fileInput) {
      const file = fileInput.files[0];
      if (!file) return null;
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
      const { error } = await supabaseClient.storage.from(bucket).upload(fileName, file);
      if (error) throw error;
      return supabaseClient.storage.from(bucket).getPublicUrl(fileName).data.publicUrl;
    }

    // --- GUARDAR COMERCIO ---
    async function guardarComercio(e) {
      e.preventDefault();
      try {
        const id = document.getElementById('shop_id').value;
        const logoUrl = await subirArchivo('logos', document.getElementById('file_logo'));
        const coverUrl = await subirArchivo('logos', document.getElementById('file_cover_image'));
        const videoUrl = await subirArchivo('videos', document.getElementById('file_video'));

        const payload = {
          business_id: document.getElementById('shop_business_id').value,
          name: document.getElementById('shop_name').value,
          category: document.getElementById('shop_category').value,
          description: document.getElementById('shop_description').value,
          address: document.getElementById('shop_address').value,
          whatsapp: document.getElementById('shop_whatsapp').value,
          schedule: document.getElementById('shop_schedule').value,
          video_url: document.getElementById('shop_video_url').value
        };

        if (logoUrl) payload.logo = logoUrl;
        if (coverUrl) payload.cover_image = coverUrl;
        if (videoUrl) payload.video = videoUrl;

        if (id) {
          await supabaseClient.from('shops').update(payload).eq('id', id);
        } else {
          await supabaseClient.from('shops').insert([payload]);
        }

        cerrarModales();
        await cargarTodo();
        alert('Comercio guardado correctamente');
      } catch (err) { alert('Error: ' + err.message); }
    }

    // --- GUARDAR PRODUCTO ---
    async function guardarProducto(e) {
      e.preventDefault();
      try {
        const imgUrl = await subirArchivo('logos', document.getElementById('prod_file'));
        const payload = {
          business_id: document.getElementById('prod_business_id').value,
          name: document.getElementById('prod_name').value,
          price: document.getElementById('prod_price').value,
          category: document.getElementById('prod_category').value,
          description: document.getElementById('prod_description').value
        };
        if (imgUrl) payload.image_url = imgUrl;

        await supabaseClient.from('shop_products').insert([payload]);
        cerrarModales();
        await cargarProductos();
        alert('Producto agregado');
      } catch (err) { alert('Error: ' + err.message); }
    }

    // --- GUARDAR BANNER ---
    async function guardarBanner(e) {
      e.preventDefault();
      try {
        const imgUrl = await subirArchivo('logos', document.getElementById('banner_file'));
        const payload = {
          business_id: document.getElementById('banner_business_id').value,
          title: document.getElementById('banner_title').value
        };
        if (imgUrl) payload.image_url = imgUrl;

        await supabaseClient.from('shop_banners').insert([payload]);
        cerrarModales();
        await cargarBanners();
        alert('Banner agregado');
      } catch (err) { alert('Error: ' + err.message); }
    }

    // --- UTILS ---
    function actualizarSelectsNegocios() {
      const options = listShops.map(s => `<option value="${s.business_id || s.id}">${s.name} (${s.business_id || s.id})</option>`).join('');
      document.getElementById('prod_business_id').innerHTML = options;
      document.getElementById('banner_business_id').innerHTML = options;
    }

    function abrirModalComercio(id = null) {
      document.getElementById('formComercio').reset();
      document.getElementById('shop_id').value = '';
      if (id) {
        const c = listShops.find(i => i.id === id);
        document.getElementById('shop_id').value = c.id;
        document.getElementById('shop_business_id').value = c.business_id || '';
        document.getElementById('shop_name').value = c.name || '';
        document.getElementById('shop_category').value = c.category || '';
        document.getElementById('shop_description').value = c.description || '';
        document.getElementById('shop_address').value = c.address || '';
        document.getElementById('shop_whatsapp').value = c.whatsapp || '';
        document.getElementById('shop_schedule').value = c.schedule || '';
        document.getElementById('shop_video_url').value = c.video_url || '';
      }
      document.getElementById('modalComercio').style.display = 'flex';
    }

    function abrirModalProducto() { document.getElementById('modalProducto').style.display = 'flex'; }
    function abrirModalBanner() { document.getElementById('modalBanner').style.display = 'flex'; }
    function cerrarModales() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

    async function eliminarRegistro(tabla, id, callback) {
      if (!confirm('¿Estás seguro de eliminar este registro?')) return;
      const { error } = await supabaseClient.from(tabla).delete().eq('id', id);
      if (error) alert(error.message);
      else callback();
    }
  </script>
</body>
</html>
